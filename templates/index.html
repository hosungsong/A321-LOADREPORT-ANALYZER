                        <marker id="arrow-red-turb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" /></marker>
                    </defs>
                    <polygon id="turb-d1" class="box" points="300,20 450,70 300,120 150,70" />
                    <text x="300" y="65" text-anchor="middle" class="text-black">VRTA LIMIT</text>
                    <text x="300" y="85" text-anchor="middle" class="text-black">EXCEEDED?</text>

                    <rect id="turb-red" class="box" x="80" y="170" width="160" height="40" />
                    <text x="160" y="195" text-anchor="middle" class="text-black" id="turb-red-txt">DO INSPECTION</text>

                    <rect id="turb-green" class="box" x="360" y="170" width="200" height="40" />
                    <text x="460" y="195" text-anchor="middle" class="text-black" id="turb-green-txt">NO INSPECTION REQUIRED</text>

                    <path id="turb-p1" class="path path-turb" d="M 225 95 L 160 95 L 160 170" marker-end="url(#arrow-gray-turb)" />
                    <text x="190" y="85" class="text-black">YES</text>
                    
                    <path id="turb-p2" class="path path-turb" d="M 375 95 L 460 95 L 460 170" marker-end="url(#arrow-gray-turb)" />
                    <text x="410" y="85" class="text-black">NO</text>
                </svg>
            </div>
        </div>
    </div>

    <script>
        let currentChart = null; 
        let pastedImageFile = null;

        function showMessage(msg, isError = true) {
            const alertBox = document.getElementById('customAlert');
            alertBox.innerText = msg;
            alertBox.style.backgroundColor = isError ? '#ef4444' : '#10b981';
            alertBox.style.display = 'block';
            alertBox.style.opacity = '1';
            setTimeout(() => {
                alertBox.style.opacity = '0';
                setTimeout(() => { alertBox.style.display = 'none'; }, 300);
            }, 4000);
        }

        const alwaysShowTooltipPlugin = {
            id: 'alwaysShowTooltip',
            afterDraw(chart, args, options) {
                const { ctx, chartArea } = chart;
                chart.data.datasets.forEach((dataset, i) => {
                    chart.getDatasetMeta(i).data.forEach((datapoint, index) => {
                        const { x, y } = datapoint.tooltipPosition();
                        
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(x, y, 8, 0, 2 * Math.PI); 
                        ctx.fillStyle = '#fde047'; 
                        ctx.fill();
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = '#111827'; 
                        ctx.stroke();

                        const customLabel = dataset.data[index].customLabel || dataset.customLabel || '';
                        if(customLabel) {
                            ctx.font = 'bold 15px Arial';
                            
                            let align = 'center';
                            let targetX = x;
                            
                            if (chartArea && x < chartArea.left + 50) {
                                align = 'left';
                                targetX = x + 12; 
                            } else if (chartArea && x > chartArea.right - 50) {
                                align = 'right';
                                targetX = x - 12; 
                            }

                            ctx.textAlign = align;
                            
                            let yOffset = customLabel.includes('MIN') ? 25 : -18;
                            
                            ctx.strokeStyle = 'white';
                            ctx.lineWidth = 4;
                            ctx.strokeText(customLabel, targetX, y + yOffset);
                            
                            ctx.fillStyle = '#111827';
                            ctx.fillText(customLabel, targetX, y + yOffset);
                        }
                        ctx.restore();
                    });
                });
            }
        };

        document.addEventListener('paste', function(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.includes('image/')) {
                    e.preventDefault(); 
                    pastedImageFile = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById('reportInput').style.display = 'none';
                        document.getElementById('analyzeBtn').style.display = 'none';
                        document.getElementById('imagePreviewContainer').style.display = 'block';
                        document.getElementById('pastedImage').src = event.target.result;
                    };
                    reader.readAsDataURL(pastedImageFile);
                }
            }
        });

        function resetInput() {
            document.getElementById('reportInput').style.display = 'block';
            document.getElementById('analyzeBtn').style.display = 'block';
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('reportInput').value = '';
            pastedImageFile = null;
        }

        async function processOCR() {
            if (!pastedImageFile) return;
            const btn = document.getElementById('ocrButton');
            btn.innerText = "⏳ 텍스트 추출 중..."; btn.disabled = true;

            const formData = new FormData();
            formData.append("file", pastedImageFile);

            try {
                const response = await fetch('/ocr', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.error) {
                    showMessage("OCR 오류: " + result.error);
                } else { 
                    resetInput(); 
                    document.getElementById('reportInput').value = result.text; 
                    showMessage("텍스트 추출 완료!", false);
                }
            } catch (error) { 
                showMessage("서버 통신 오류가 발생했습니다."); 
            } finally { 
                btn.innerText = "🤖 AI 이미지 텍스트 추출"; btn.disabled = false; 
            }
        }

        async function submitData() {
            const textData = document.getElementById('reportInput').value;
            if(!textData.trim()) { 
                showMessage("분석할 리포트 데이터를 입력해주세요."); 
                return; 
            }
            const btn = document.getElementById('analyzeBtn');
            btn.innerText = "분석 중..."; btn.disabled = true;

            try {
                const response = await fetch('/analyze', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textData })
                });
                const result = await response.json();
                if (result.error) {
                    showMessage("서버 분석 오류: " + result.error);
                } else {
                    displayResult(result);
                }
            } catch (error) { 
                showMessage("서버 통신 오류가 발생했습니다. 백엔드가 실행 중인지 확인하세요."); 
            } finally { 
                btn.innerText = "데이터 분석 (Analyze)"; btn.disabled = false; 
            }
        }

        function displayResult(data) {
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('fleetType').innerText = data.fleet_type;
            
            if(data.aircraft_id && data.aircraft_id !== "UNKNOWN") {
                document.getElementById('acId').innerText = `(${data.aircraft_id})`;
            } else {
                document.getElementById('acId').innerText = "";
            }
            
            document.getElementById('triggerCode').innerText = data.trigger_code;
            
            const remarkEl = document.getElementById('triggerRemark');
            if (data.trigger_code === '1000') {
                remarkEl.innerText = "(Trigger code 1000 is a manual report request. It can not be used for a confirmation of a hard/overweight landing or excessive turbulence.)";
            } else if (data.trigger_code === '7000') {
                remarkEl.innerText = "(Standard Trigger: Normal Landing)";
            } else {
                remarkEl.innerText = "";
            }

            document.getElementById('reasonText').innerText = data.reason;

            const statusBox = document.getElementById('statusBox');
            statusBox.className = 'status-box'; 
            if (data.status === 'RED') statusBox.classList.add('status-RED');
            else if (data.status === 'AMBER') statusBox.classList.add('status-AMBER');
            else statusBox.classList.add('status-GREEN');
            statusBox.innerText = data.status + " ZONE";

            let maxNz = 0, maxNy = 0, maxLata = 0;
            if (data.kpi_data) {
                for (const key in data.kpi_data) {
                    let item = data.kpi_data[key];
                    if (item.Nz_kpi !== undefined) maxNz = Math.max(maxNz, item.Nz_kpi);
                    if (item.Ny_kpi !== undefined) maxNy = Math.max(maxNy, item.Ny_kpi);
                    if (item.VRTA !== undefined) maxNz = Math.max(maxNz, item.VRTA); 
                    if (item.LATA !== undefined) maxLata = Math.max(maxLata, item.LATA);
                }
            }
            
            drawChart(data, maxNy, maxNz, maxLata);
            drawFlowchart(data, maxNz, maxNy, maxLata);
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function drawChart(data, ny, nz, lata) {
            const ctx = document.getElementById('limitChart').getContext('2d');
            if (currentChart) currentChart.destroy(); 
            
            let chartData, chartOptions, pointLabel = "";
            let code = data.trigger_code;
            let fleet = data.fleet_type;
            let gw = data.gw_lbs;
            let mlw = data.mlw_lbs;

            const chartDiv = document.getElementById('chartDiv');

            if (fleet === 'CEO' && code.startsWith('4')) {
                chartDiv.style.height = '450px';
                document.getElementById('chartTitle').innerText = '📊 CEO Hard Landing Limit (Weight vs VRTA)';
                pointLabel = `GW: ${gw.toLocaleString()} / VRTA: ${nz}g`; 
                
                chartData = { datasets: [{ data: [{x: gw > 0 ? gw : 150000, y: nz}], customLabel: pointLabel, pointRadius: 0 }] };
                chartOptions = {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false }, tooltip: { enabled: false },
                        annotation: { 
                            drawTime: 'beforeDatasetsDraw', 
                            annotations: { 
                                boxLeftRed: { type: 'box', xMin: 100000, xMax: mlw, yMin: 2.86, yMax: 4.0, backgroundColor: 'rgba(239, 68, 68, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                boxLeftAmber: { type: 'box', xMin: 100000, xMax: mlw, yMin: 2.6, yMax: 2.86, backgroundColor: 'rgba(245, 158, 11, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                boxLeftGreen: { type: 'box', xMin: 100000, xMax: mlw, yMin: 0, yMax: 2.6, backgroundColor: 'rgba(16, 185, 129, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                boxRightRed: { type: 'box', xMin: mlw, xMax: 220000, yMin: 2.6, yMax: 4.0, backgroundColor: 'rgba(239, 68, 68, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                boxRightAmber: { type: 'box', xMin: mlw, xMax: 220000, yMin: 1.7, yMax: 2.6, backgroundColor: 'rgba(245, 158, 11, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                boxRightGreen: { type: 'box', xMin: mlw, xMax: 220000, yMin: 0, yMax: 1.7, backgroundColor: 'rgba(16, 185, 129, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                lineMlw: { type: 'line', xMin: mlw, xMax: mlw, yMin: 0, yMax: 4.0, borderColor: '#111827', borderWidth: 2, label: { content: 'MLW', display: true, position: 'start', backgroundColor: '#111827', color: 'white' } }
                            } 
                        } 
                    },
                    scales: {
                        x: { type: 'linear', position: 'bottom', title: {display: true, text: 'AIRCRAFT WEIGHT (LBS)', font: {weight: 'bold'}, padding: {top: 15}}, min: 100000, max: 220000, ticks: { padding: 10 } },
                        y: { title: {display: true, text: 'VRTA (g)', font: {weight: 'bold'}, padding: {bottom: 15}}, min: 0, max: 4.0 }
                    }
                };
            } else if (fleet === 'NEO' && code.startsWith('4')) {
                chartDiv.style.height = '450px';
                document.getElementById('chartTitle').innerText = '📊 NEO Hard Landing Limit (Nz, Ny)';
                pointLabel = `Nz: ${nz}g / Ny: ${ny}g`; 
                
                chartData = { datasets: [{ data: [{x: ny, y: nz}], customLabel: pointLabel, pointRadius: 0 }] };
                chartOptions = {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false }, tooltip: { enabled: false }, 
                        annotation: { 
                            drawTime: 'beforeDatasetsDraw', 
                            annotations: { 
                                boxRed: { type: 'box', xMin: 0, xMax: 1.0, yMin: 0, yMax: 2.5, backgroundColor: 'rgba(239, 68, 68, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                boxAmber: { type: 'box', xMin: 0, xMax: 0.5, yMin: 0, yMax: 2.06, backgroundColor: 'rgba(245, 158, 11, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                boxGreen: { type: 'box', xMin: 0, xMax: 0.45, yMin: 0, yMax: 1.80, backgroundColor: 'rgba(16, 185, 129, 1.0)', borderWidth: 1, borderColor: '#1f2937' }
                            } 
                        } 
                    },
                    scales: { 
                        x: { type: 'linear', position: 'bottom', title: {display: true, text: 'Ny (측면) g', font: {weight: 'bold'}, padding: {top: 15}}, min: 0, max: 0.6, ticks: { padding: 10 } }, 
                        y: { title: {display: true, text: 'Nz (수직) g', font: {weight: 'bold'}, padding: {bottom: 15}}, min: 0, max: 2.5 } 
                    }
                };
            } else if (code.startsWith('5')) {
                if (code === '5600' || code === '5700') {
                    chartDiv.style.height = '160px'; 
                    document.getElementById('chartTitle').innerText = '📊 High Lateral Limit (AMM TASK 05-51-44-200-001-A)';
                    pointLabel = `LATA: ${lata}g`;
                    chartData = { datasets: [{ data: [{x: lata, y: 0.5}], customLabel: pointLabel, pointRadius: 0 }] };
                    chartOptions = {
                        responsive: true, maintainAspectRatio: false,
                        layout: { padding: { top: 40, left: 20, right: 20, bottom: 20 } },
                        plugins: { 
                            legend: { display: false }, tooltip: { enabled: false }, 
                            annotation: { 
                                drawTime: 'beforeDatasetsDraw', 
                                annotations: { 
                                    boxGreen: { type: 'box', xMin: 0, xMax: 0.35, yMin: 0.3, yMax: 0.7, backgroundColor: 'rgba(16, 185, 129, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                    boxAmber: { type: 'box', xMin: 0.35, xMax: 0.41, yMin: 0.3, yMax: 0.7, backgroundColor: 'rgba(245, 158, 11, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                    boxRed: { type: 'box', xMin: 0.41, xMax: 0.6, yMin: 0.3, yMax: 0.7, backgroundColor: 'rgba(239, 68, 68, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                    line1: { type: 'line', xMin: 0.1, xMax: 0.1, yMin: 0.3, yMax: 0.7, borderColor: '#1f2937', borderWidth: 1 },
                                    line2: { type: 'line', xMin: 0.2, xMax: 0.2, yMin: 0.3, yMax: 0.7, borderColor: '#1f2937', borderWidth: 1 },
                                    line3: { type: 'line', xMin: 0.3, xMax: 0.3, yMin: 0.3, yMax: 0.7, borderColor: '#1f2937', borderWidth: 1 }
                                } 
                            } 
                        },
                        scales: { 
                            x: { type: 'linear', position: 'bottom', title: {display: true, text: 'LATA (g)', font: {weight: 'bold'}, padding: {top: 15}}, ticks: { padding: 10 }, min: 0, max: 0.6 }, 
                            y: { display: false, min: 0, max: 1.0 } 
                        }
                    };
                } else {
                    chartDiv.style.height = '160px'; 
                    let isClean = (code === '5100' || code === '5200');
                    document.getElementById('chartTitle').innerText = isClean ? '📊 Turbulence Limit (CLEAN CONFIGURATION)' : '📊 Turbulence Limit (FLAPS AND/OR SLATS EXTENDED)';
                    
                    let minLim = isClean ? -1.0 : 0.0;
                    let maxLim = isClean ? 2.5 : 2.0;

                    let tMax = 0, tMin = 0;
                    if (data.kpi_data && data.kpi_data.Turb) {
                        tMax = data.kpi_data.Turb.VRTA_MAX;
                        tMin = data.kpi_data.Turb.VRTA_MIN;
                    }

                    chartData = { 
                        datasets: [{ 
                            data: [
                                {x: tMax, y: 0.5, customLabel: `MAX: ${tMax}g`},
                                {x: tMin, y: 0.5, customLabel: `MIN: ${tMin}g`}
                            ], 
                            pointRadius: 0 
                        }] 
                    };

                    chartOptions = {
                        responsive: true, maintainAspectRatio: false,
                        layout: { padding: { top: 40, left: 20, right: 20, bottom: 20 } },
                        plugins: { 
                            legend: { display: false }, tooltip: { enabled: false }, 
                            annotation: { 
                                drawTime: 'beforeDatasetsDraw', 
                                annotations: { 
                                    boxLeftRed: { type: 'box', xMin: -3.0, xMax: minLim, yMin: 0.45, yMax: 0.55, backgroundColor: 'rgba(239, 68, 68, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                    boxRightRed: { type: 'box', xMin: maxLim, xMax: 4.5, yMin: 0.45, yMax: 0.55, backgroundColor: 'rgba(239, 68, 68, 1.0)', borderWidth: 1, borderColor: '#1f2937' },
                                    boxGreen: { type: 'box', xMin: minLim, xMax: maxLim, yMin: 0.45, yMax: 0.55, backgroundColor: 'rgba(16, 185, 129, 1.0)', borderWidth: 1, borderColor: '#1f2937' }
                                } 
                            } 
                        },
                        scales: { 
                            x: { type: 'linear', position: 'bottom', title: {display: true, text: 'VRTA (g)', font: {weight: 'bold'}, padding: {top: 15}}, ticks: { padding: 10 }, min: -2.0, max: 3.5 }, 
                            y: { display: false, min: 0, max: 1.0 } 
                        }
                    };
                }
            }

            currentChart = new Chart(ctx, { type: 'scatter', data: chartData, options: chartOptions, plugins: [alwaysShowTooltipPlugin] });
        }

        function drawFlowchart(data, vrta, ny, lata) {
            document.querySelectorAll('.svg-flowchart-container').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.path').forEach(el => { el.classList.remove('active'); el.setAttribute('marker-end', 'url(#arrow-gray)'); });
            document.querySelectorAll('.path-neo').forEach(el => { el.classList.remove('active'); el.setAttribute('marker-end', 'url(#arrow-gray-neo)'); });
            document.querySelectorAll('.path-turb').forEach(el => { el.classList.remove('active'); el.setAttribute('marker-end', 'url(#arrow-gray-turb)'); });
            document.querySelectorAll('.box').forEach(el => { el.classList.remove('active-green', 'active-amber', 'active-red'); });
            document.querySelectorAll('.text-white').forEach(el => { el.classList.replace('text-white', 'text-black'); });
            
            document.getElementById('neo-b-green').style.display = 'none';
            document.getElementById('neo-b-green-txt').style.display = 'none';
            document.getElementById('neo-p-green').style.display = 'none';

            let code = data.trigger_code;
            let fleet = data.fleet_type;
            let gw = data.gw_lbs;
            let mlw = data.mlw_lbs;
            let status = data.status;

            const flowchartTitleEl = document.getElementById('flowchartTitle');
            flowchartTitleEl.style.display = 'block';

            if (code === '5600' || code === '5700') {
                flowchartTitleEl.style.display = 'none';
            } else if (code.startsWith('5')) {
                flowchartTitleEl.innerText = '🔀 Decision Flow Chart (AMM TASK 05-51-17-200-001-A)';
            } else if (fleet === 'NEO') {
                flowchartTitleEl.innerText = '🔀 Decision Flow Chart (AMM TASK 05-51-11-200-004-C)';
            } else {
                flowchartTitleEl.innerText = '🔀 Decision Flow Chart (AMM TASK 05-51-11-200-004-B)';
            }

            if (code.startsWith('4') && fleet === 'CEO') {
                document.getElementById('ceoFlowchartArea').style.display = 'block';
                let activePaths = [], endNodeId = '', statusClass = '';
                
                if (gw <= mlw) {
                    activePaths.push('ceo-p1');
                    if (vrta >= 2.86) { activePaths.push('ceo-p3', 'ceo-p7'); endNodeId = 'ceo-shl'; statusClass = 'active-red'; }
                    else if (vrta >= 2.6) { activePaths.push('ceo-p3', 'ceo-p8'); endNodeId = 'ceo-hl'; statusClass = 'active-amber'; }
                    else { activePaths.push('ceo-p4'); endNodeId = 'ceo-nms1'; statusClass = 'active-green'; }
                } else {
                    activePaths.push('ceo-p2');
                    if (vrta >= 2.6) { activePaths.push('ceo-p5', 'ceo-p9'); endNodeId = 'ceo-shol'; statusClass = 'active-red'; }
                    else if (vrta >= 1.7) { activePaths.push('ceo-p5', 'ceo-p10'); endNodeId = 'ceo-hol'; statusClass = 'active-amber'; }
                    else { activePaths.push('ceo-p6'); endNodeId = 'ceo-nms2'; statusClass = 'active-green'; }
                }

                activePaths.forEach(id => {
                    const path = document.getElementById(id);
                    path.classList.add('active');
                    path.setAttribute('marker-end', 'url(#arrow-red)');
                });
                if(endNodeId) { 
                    document.getElementById(endNodeId).classList.add(statusClass); 
                    document.getElementById(endNodeId+'-txt').classList.replace('text-black', 'text-white'); 
                }
            
            } else if (code.startsWith('4') && fleet === 'NEO') {
                document.getElementById('neoFlowchartArea').style.display = 'block';
                let activePaths = [], endNodeId = '', statusClass = '';
                let nz = vrta; // backend assigns max_nz to VRTA key conceptually for generic drawing, but here we use vrta parameter which receives maxNz

                if (status === 'RED') {
                    activePaths.push('neo-p1-l', 'neo-p-findsev', 'neo-p-trunk');
                    if (gw <= mlw) {
                        activePaths.push('neo-p-b1', 'neo-p-act1-1');
                        endNodeId = 'neo-act1'; statusClass = 'active-red';
                        document.getElementById('neo-b1').classList.add('active-red');
                        document.getElementById('neo-b1-txt').classList.replace('text-black', 'text-white');
                    } else {
                        activePaths.push('neo-p-b2', 'neo-p-act1-2');
                        endNodeId = 'neo-act1'; statusClass = 'active-red';
                        document.getElementById('neo-b2').classList.add('active-red');
                        document.getElementById('neo-b2-txt').classList.replace('text-black', 'text-white');
                    }
                } else if (status === 'AMBER') {
                    activePaths.push('neo-p1-l', 'neo-p-findsev', 'neo-p-trunk');
                    if (gw <= mlw) {
                        activePaths.push('neo-p-b3', 'neo-p-act2-1');
                        endNodeId = 'neo-act2'; statusClass = 'active-amber';
                        document.getElementById('neo-b3').classList.add('active-amber');
                        document.getElementById('neo-b3-txt').classList.replace('text-black', 'text-white');
                    } else {
                        activePaths.push('neo-p-b4', 'neo-p-act2-2');
                        endNodeId = 'neo-act2'; statusClass = 'active-amber';
                        document.getElementById('neo-b4').classList.add('active-amber');
                        document.getElementById('neo-b4-txt').classList.replace('text-black', 'text-white');
                    }
                } else {
                    // GREEN status
                    if (nz >= 0.8) {
                        // Left branch but limits not exceeded
                        activePaths.push('neo-p1-l', 'neo-p-findsev');
                        document.getElementById('neo-b-green').style.display = 'block';
                        document.getElementById('neo-b-green-txt').style.display = 'block';
                        document.getElementById('neo-p-green').style.display = 'block';
                        activePaths.push('neo-p-green');
                        endNodeId = 'neo-b-green'; statusClass = 'active-green';
                    } else {
                        // Right branch
                        activePaths.push('neo-p1-r', 'neo-p-getconf', 'neo-p-diamond', 'neo-p-no');
                        endNodeId = 'neo-backop'; statusClass = 'active-green';
                    }
                }

                activePaths.forEach(id => {
                    const path = document.getElementById(id);
                    if(path) {
                        path.classList.add('active');
                        path.setAttribute('marker-end', 'url(#arrow-red-neo)');
                    }
                });
                if(endNodeId) { 
                    document.getElementById(endNodeId).classList.add(statusClass); 
                    document.getElementById(endNodeId+'-txt').classList.replace('text-black', 'text-white'); 
                }
            
            } else if (code === '5100' || code === '5200' || code === '5300') {
                document.getElementById('turbFlowchartArea').style.display = 'block';
                let activePaths = [], endNodeId = '', statusClass = '';
                
                if (status === 'RED') { activePaths.push('turb-p1'); endNodeId = 'turb-red'; statusClass = 'active-red'; }
                else { activePaths.push('turb-p2'); endNodeId = 'turb-green'; statusClass = 'active-green'; }

                activePaths.forEach(id => {
                    const path = document.getElementById(id);
                    path.classList.add('active');
                    path.setAttribute('marker-end', 'url(#arrow-red-turb)');
                });
                if(endNodeId) { 
                    document.getElementById(endNodeId).classList.add(statusClass); 
                    document.getElementById(endNodeId+'-txt').classList.replace('text-black', 'text-white'); 
                }
            }
        }
    </script>
</body>
</html>
